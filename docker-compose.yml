services:
  openwebui:
    build: .
    container_name: open-webui-local
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "cachyos:192.168.100.17"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://cachyos:9900/v1
      - OPENAI_API_KEY=none
      - WHISPER_MODEL_AUTO_UPDATE=true
      - BYPASS_MODEL_ACCESS_CONTROL=true
    networks:
      - shared-network
    restart: unless-stopped

  openterminal:
    image: ghcr.io/open-webui/open-terminal
    container_name: open-terminal
    ports:
      - "8081:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-terminal:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=sk-8117d4b7-2c7e-4ec4-afe6-8130d10c379c
      - OPEN_TERMINAL_MULTI_USER=true
    networks:
      - shared-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 16G

networks:
  shared-network:
    external: true

volumes:
  open-webui:
  open-terminal:

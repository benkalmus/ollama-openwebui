services:
  # This exposes your OpenWebUI to the internet
  caddy-proxy:
    image: caddy:latest
    container_name: ollama-caddy-localopenweb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - /home/benkalmus/work/portfolio-web-bootstrap:/app
      - /home/benkalmus/work/hugo-blog/production/public:/blog
      # certificates for xray
      - /opt/certs:/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/pass.benkalmus.com
    networks:
      - internal-network
      - shared-network
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-local
    ports:
      - "8080:8080" # for debugging, you will be able to call localhost:8080 from your private network
    extra_hosts:
      - "host.docker.internal:host-gateway" # NOTE: Dont forget to allow port 11469 with ufw!!!
      - "kubuntu.local:192.168.100.13"
    volumes:
      - open-webui:/app/backend/data
    environment:
      # set open-webui to call ollama through a loadbalancer. this way we can have multiple instances of ollama
      # depending on if a server is down. (For example, I might want to keep my home PC turned off at night)
      # ollama is running on a private VPN tunnel
      - OLLAMA_BASE_URL=http://haproxy:11444
      - WHISPER_MODEL_AUTO_UPDATE=true
      # allow all models to be publicly available (to users)
      - BYPASS_MODEL_ACCESS_CONTROL=true
    networks:
      - internal-network
      - shared-network
    restart: unless-stopped

  openterminal:
    image: ghcr.io/open-webui/open-terminal
    container_name: open-terminal
    ports:
      - "8081:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "kubuntu.local:192.168.100.13"
    volumes:
      - open-terminal:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=sk-8117d4b7-2c7e-4ec4-afe6-8130d10c379c
      - OPEN_TERMINAL_MULTI_USER=true
      # space separated list
      # - OPEN_TERMINAL_PACKAGES=""
      # - OPEN_TERMINAL_PIP_PACKAGES="lixplore-cli "
    networks:
      - internal-network
      - shared-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 16G

  haproxy:
    image: haproxy:latest
    container_name: haproxy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - internal-network
      - shared-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "kubuntu.local:192.168.100.14"
      - "esprimo.local:192.168.100.13"
    restart: unless-stopped
  # Docker instance of ollama.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   volumes:
  #     - ollama-docker:/root/.ollama
  #   ports:
  #     - "11333:11333" # this will allow you to query ollama as well, curl localhost:11333
  #   networks:
  #     - internal-network
  #     - shared-network
  #   expose:
  #     - "11333" # expose port 11333 internally
  #   environment:
  #     # Configure local instance of ollama to run on :11333
  #     - OLLAMA_HOST=0.0.0.0:11333
  #   restart: unless-stopped
  # uncomment for GPU
  # deploy:
  #   resources:
  #     reservations:
  #       devices:
  #         - driver: nvidia
  #           count: all
  #           capabilities: [ gpu ]
  # uncomment for kokoro tts locally
  # kokoro-tts:
  #   container_name: kokoro-tts
  #   restart: unless-stopped
  #   networks:
  #     - internal-network
  #   ports:
  #     - 8880:8880
  #   image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
  #   uncomment for CPU only
  #   image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

networks:
  internal-network:
    driver: bridge
  shared-network:
    external: true

volumes:
  caddy-data:
  caddy-config:
  open-webui:
  open-terminal:
  ollama-docker:

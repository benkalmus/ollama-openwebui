global
    maxconn 2000            # Maximum simultaneous connections
    log         127.0.0.1 local2
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s      # Timeout for connecting to the backend
    timeout client  30s     # Timeout for client responses
    timeout server  30s     # Timeout for server responses

# OLLAMA service running behind multiple separate systems
frontend http-in
    bind *:11444
    log 127.0.0.1 local2
    default_backend fallback-backend

backend fallback-backend
    balance first           # Ensures HAProxy sends traffic only to the first available (healthy) server
    option httpchk GET /    # HTTP health check for the root path
    http-check expect status 200  # Expect status 200 from health check for successful routing
    server primary 10.10.10.2:11434 check fall 1 rise 1 inter 10s # check every 10s, if HC != 200 3 times, return 503 response
    server secondary ollama:11333 check backup fall 1 rise 1 inter 10s  # docker-compose register ollama service name

# Kokoro text to speech service running on two machines
frontend kokoro-tts 
    bind *:8880
    log 127.0.0.1 local2
    default_backend kokoro-tts-backend

backend kokoro-tts-backend
    balance first 
    # checks if service is running, eventhough it responds with 404
    option httpchk GET /
    http-check expect status 404
    # kubuntu machine running kokoro with GPU
    server primary 10.10.10.2:8880 check fall 1 rise 1 inter 5s
    # esprimo machine running kokoro with CPU only (slower)
    server secondary 10.10.10.3:8880 check fall 1 rise 1 inter 5s

# Wake on lan service running on two machines
frontend wakeonlan
    bind *:8888
    log 127.0.0.1 local2
    default_backend wakeonlan-backend

backend wakeonlan-backend
    balance first 
    # checks if service is running, eventhough it responds with 404
    option httpchk GET /health
    http-check expect status 200
    # raspberry pi
    server primary 10.10.10.4:8000 check fall 1 rise 1 inter 5s
    # esprimo machine
    server secondary 10.10.10.3:8000 check fall 1 rise 1 inter 5s
